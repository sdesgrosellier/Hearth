name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx expo export --platform web --output-dir ../dist
        working-directory: app
        env:
          NODE_ENV: production   # loads app/.env.production (public values)
          CI: "1"
      - name: Add SPA fallback and disable Jekyll
        run: |
          node scripts/decorate-web-shell.mjs dist/index.html
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          rm -f dist/metadata.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
