# Supabase CLI config (local development). `supabase init` generates a fuller file;
# these are the settings Hearth depends on.

project_id = "hearth"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "hearth://"
additional_redirect_urls = ["hearth://", "exp://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
otp_length = 6
otp_expiry = 600

# Phase 1 signs in with email one-time codes. Local dev uses Inbucket (http://localhost:54324)
# to read the codes. Production needs an SMTP provider configured in the dashboard.

[functions.chat]
verify_jwt = true

[edge_runtime]
enabled = true
policy = "per_worker"
